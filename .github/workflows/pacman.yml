name: Generate Pacman Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Pacman Graph
        uses: qwerdcv/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          output_branch: output

      - name: Ensure files are pushed
        run: echo "Pacman generated successfully"
