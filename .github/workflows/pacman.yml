name: Pacman Contribution

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  pacman:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: pawel-zajac-dev
          template: classic
          base: ""
          config_timezone: Europe/Warsaw
          plugin_isocalendar: yes
          plugin_isocalendar_sections: ""
          plugin_languages: no
          output_action: commit
          committer_branch: pacman-output
          filename: github-pacman.svg
          plugin_pacman: yes
          plugin_pacman_max_delay: 20
