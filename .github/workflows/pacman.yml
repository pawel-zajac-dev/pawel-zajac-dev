name: Pacman Contribution

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Generate Pacman SVG
        run: |
          git clone --depth 1 https://github.com/abhisheknaiidu/pacman-contributions.git pacman-src
          cd pacman-src
          npm install
          npm run build || node index.js || node src/index.js
          find . -name "*.svg" -exec cp {} ../pacman.svg \;
          cd ..
          rm -rf pacman-src
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to pacman-output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: pacman-output
          destination_dir: ./
          keep_files: false
